<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in to GitHub · GitHub</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-page">

  <main class="login-page__main">
    <div class="login-card">

      <header class="login-card__header">
        <div class="login-card__logo">
          <svg height="48" viewBox="0 0 16 16" width="48" aria-hidden="true">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </div>
        <h1 class="login-card__title">Sign in to GitHub</h1>
      </header>

      <div class="login-card__body">

        <form class="login-form">

          <div class="login-form__field">
            <label class="login-form__label" for="login-username">Username or email address</label>
            <input class="login-form__input" id="login-username" name="username"
                   type="text" autocomplete="username" autocapitalize="off" spellcheck="false" />
          </div>

          <div class="login-form__field">
            <div class="login-form__label-row">
              <label class="login-form__label" for="login-password">Password</label>
              <a class="login-form__forgot" href="#">Forgot password?</a>
            </div>
            <input class="login-form__input" id="login-password" name="password"
                   type="password" autocomplete="current-password" />
          </div>

          <button class="login-form__submit" type="submit">Sign in</button>
        </form>

        <hr class="login-card__divider" />

        <div class="login-oauth">
          <button class="login-oauth__provider" type="button">
            <img class="login-oauth__logo" src="" alt="" />
            <span class="login-oauth__text">Sign in with Google</span>
          </button>
          <button class="login-oauth__provider" type="button">
            <img class="login-oauth__logo" src="" alt="" />
            <span class="login-oauth__text">Sign in with Apple</span>
          </button>
        </div>

      </div>

      <footer class="login-card__footer">
        <div class="login-card__register">
          <span class="login-card__register-text">New to GitHub?</span>
          <a class="login-card__register-link" href="#">Create an account</a>
        </div>
        <button class="login-card__passkey" type="button">Sign in with a passkey</button>
      </footer>

    </div>
  </main>

  <footer class="site-footer">
    <a class="site-footer__item" href="#">Terms</a>
    <a class="site-footer__item" href="#">Privacy</a>
    <a class="site-footer__item" href="#">Docs</a>
    <a class="site-footer__item" href="#">Contact GitHub Support</a>
    <a class="site-footer__item" href="#">Manage cookies</a>
    <a class="site-footer__item" href="#">Do not share my personal information</a>
  </footer>

</body>
</html>
